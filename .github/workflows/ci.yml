name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/check_public_artifacts.py

  unit:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_public_artifacts.py --dist dist
      - name: Install and exercise the wheel outside the checkout
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -c 'from line_markdown_parser import convert_markdown_to_line_messages as convert; assert convert("**Hello**")[0]["type"] == "flex"'

  required:
    name: test
    if: ${{ always() }}
    needs: [lint, unit, build]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.lint.result }}' = success && test '${{ needs.unit.result }}' = success && test '${{ needs.build.result }}' = success
